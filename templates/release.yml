# expo-kit release (remote mode): builds the app on EAS from the git commit `expo-kit release` passes
# with --ref, then uploads each build with the production submit profile. Nothing uploads from the
# machine running the release. Started only by `eas workflow:run`, never by a push.
name: expo-kit release

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, ios, android]
        default: all
        description: Which platforms to build and submit

jobs:
  build_ios:
    name: Build iOS
    if: ${{ inputs.platform != 'android' }}
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    if: ${{ inputs.platform != 'ios' }}
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit iOS
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit Android
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
